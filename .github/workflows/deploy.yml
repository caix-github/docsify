name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的分支/标签/commit SHA（留空则用当前分支）'
        required: false
        default: ''
      force:
        description: '无文件变更时也强制部署（用于重新发布）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

# 简化并发分组，只允许1个pages部署任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify site files
        run: |
          if [ ! -f "docs/index.html" ]; then
            echo "::error::docs/index.html 不存在，部署中止"
            exit 1
          fi
          touch docs/.nojekyll
          echo "✅ 站点文件检查通过"
          ls -la docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
