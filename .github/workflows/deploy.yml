name: Deploy to GitHub Pages

# 触发条件：
#   - 自动：推送到 main / master / dev 分支时
#   - 手动：在 Actions 页面点 "Run workflow"，可指定任意分支/标签/commit
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的分支/标签/commit SHA（留空则用当前分支）'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，新任务自动取消旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify site files
        run: |
          if [ ! -f "docs/index.html" ]; then
            echo "::error::docs/index.html 不存在，部署中止"
            exit 1
          fi
          # .nojekyll 用于禁用 GitHub Pages 的 Jekyll 处理
          # 避免下划线开头的文件（如 _coverpage.md / _sidebar.md）被忽略
          touch docs/.nojekyll
          echo "✓ 站点文件检查通过"
          ls -la docs/

      # 关键修复：清理本次运行可能残留的旧 artifact
      # 避免 deploy-pages 报 "Multiple artifacts named github-pages" 错误
      # （常见于 Re-run failed jobs 时上次上传的 artifact 未被清理）
      - name: Delete existing github-pages artifacts
        uses: actions/delete-artifact@v4
        with:
          name: github-pages
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
