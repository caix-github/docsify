name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的分支/标签/commit SHA（留空则用当前分支）'
        required: false
        default: ''
      force:
        description: '无文件变更时也强制部署（用于重新发布）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：pages组，同一时间只允许1个运行，取消正在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # 【重点修改】按工作流+分支分组，不同分支互不干扰
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # 升级v5，消除Node20废弃警告
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify site files
        run: |
          if [ ! -f "docs/index.html" ]; then
            echo "::error::docs/index.html 不存在，部署中止"
            exit 1
          fi
          # .nojekyll 用于禁用 GitHub Pages 的 Jekyll 处理
          # 避免下划线开头的文件（如 _coverage.md / _sidebar.md）被忽略
          touch docs/.nojekyll
          echo "✅ 站点文件检查通过"
          ls -la docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
