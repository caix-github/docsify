name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的分支/标签/commit SHA（留空则用当前分支）'
        required: false
        default: ''
      force:
        description: '无文件变更时也强制部署（用于重新发布）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Clean old build folder
        run: |
          rm -rf docs/_site
          echo "✅ 旧打包目录 docs/_site 已清空"

      - name: Install docsify-cli
        run: npm install -g docsify-cli

      - name: Build static html
        run: docsify build docs --output docs/_site

      - name: Verify site files
        run: |
          if [ ! -f "docs/_site/index.html" ]; then
            echo "::error::打包后的 docs/_site/index.html 不存在，部署中止"
            exit 1
          fi
          touch docs/_site/.nojekyll
          echo "✅ 站点文件检查通过"
          ls -la docs/_site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
